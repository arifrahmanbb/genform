<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1544px;
    height: 500px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f8f7ff;
  }

  .banner {
    width: 1544px;
    height: 500px;
    display: flex;
    align-items: stretch;
    position: relative;
    overflow: hidden;
  }

  .accent {
    width: 12px;
    background: linear-gradient(180deg, #6366f1 0%, #4338ca 100%);
    flex-shrink: 0;
  }

  .left {
    flex: 0 0 780px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 50px 80px 50px 72px;
    position: relative;
    z-index: 2;
  }

  .logo-row {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-bottom: 24px;
  }

  .logo-icon {
    width: 84px;
    height: 84px;
    border-radius: 20px;
    background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 28px rgba(99,102,241,0.4);
    flex-shrink: 0;
  }

  .logo-icon svg {
    width: 56px;
    height: 56px;
  }

  .logo-text {
    font-size: 50px;
    font-weight: 800;
    color: #1e1b4b;
    letter-spacing: -1px;
    line-height: 1;
  }

  .logo-text span { color: #6366f1; }

  .tagline {
    font-size: 20px;
    color: #4b5563;
    line-height: 1.5;
    margin-bottom: 26px;
    max-width: 580px;
    font-weight: 500;
  }

  .features {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .feature-pill {
    display: flex;
    align-items: center;
    gap: 7px;
    background: white;
    border: 2px solid #e0e7ff;
    border-radius: 30px;
    padding: 7px 15px;
    font-size: 14px;
    color: #4338ca;
    font-weight: 700;
    white-space: nowrap;
  }

  .feature-pill::before {
    content: '✓';
    color: #6366f1;
    font-weight: 900;
    font-size: 14px;
  }

  .right {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .bg-circle-1 {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(99,102,241,0.12) 0%, transparent 70%);
    top: -160px;
    right: -120px;
  }

  .bg-circle-2 {
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(67,56,202,0.08) 0%, transparent 70%);
    bottom: -120px;
    right: 120px;
  }

  .form-card {
    width: 420px;
    background: white;
    border-radius: 22px;
    box-shadow: 0 16px 64px rgba(99,102,241,0.18), 0 4px 16px rgba(0,0,0,0.06);
    padding: 28px;
    position: relative;
    z-index: 2;
  }

  .form-card-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
    padding-bottom: 18px;
    border-bottom: 1px solid #f0f0f0;
  }

  .header-dot {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: #6366f1;
  }

  .header-title {
    font-size: 16px;
    font-weight: 800;
    color: #1e1b4b;
  }

  .field-group {
    margin-bottom: 14px;
  }

  .field-label {
    height: 9px;
    width: 80px;
    background: #e0e7ff;
    border-radius: 5px;
    margin-bottom: 8px;
  }

  .field-input {
    height: 34px;
    background: #f8f7ff;
    border: 2px solid #e0e7ff;
    border-radius: 8px;
    width: 100%;
  }

  .field-row {
    display: flex;
    gap: 12px;
    margin-bottom: 14px;
  }

  .field-row .field-group {
    flex: 1;
    margin-bottom: 0;
  }

  .submit-btn {
    height: 44px;
    background: linear-gradient(135deg, #6366f1, #4338ca);
    border-radius: 12px;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 16px;
    box-shadow: 0 4px 18px rgba(99,102,241,0.4);
  }

  .submit-text {
    font-size: 14px;
    font-weight: 800;
    color: white;
    letter-spacing: 0.3px;
  }

  .badge {
    position: absolute;
    top: -16px;
    right: -16px;
    background: #10b981;
    color: white;
    font-size: 12px;
    font-weight: 800;
    padding: 5px 13px;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(16,185,129,0.4);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .divider {
    position: absolute;
    left: 792px;
    top: 40px;
    bottom: 40px;
    width: 1px;
    background: linear-gradient(180deg, transparent, #e0e7ff 30%, #e0e7ff 70%, transparent);
  }
</style>
</head>
<body>
<div class="banner">
  <div class="accent"></div>

  <div class="left">
    <div class="logo-row">
      <div class="logo-icon">
        <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="8" y="6" width="40" height="46" rx="6" fill="white" opacity="0.2"/>
          <rect x="8" y="6" width="40" height="46" rx="6" stroke="white" stroke-width="2.5" fill="none"/>
          <rect x="16" y="18" width="24" height="4" rx="2" fill="white" opacity="0.9"/>
          <rect x="16" y="26" width="24" height="4" rx="2" fill="white" opacity="0.9"/>
          <rect x="16" y="34" width="14" height="4" rx="2" fill="white" opacity="0.9"/>
          <rect x="33" y="33" width="15" height="11" rx="4" fill="white"/>
          <polyline points="35.5,38.5 39,42 46,35" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="logo-text">Gen<span>Form</span></div>
    </div>

    <p class="tagline">The smart, lightweight drag-and-drop form builder for WordPress. No code required.</p>

    <div class="features">
      <span class="feature-pill">12 Field Types</span>
      <span class="feature-pill">Email Notifications</span>
      <span class="feature-pill">Entry Management</span>
      <span class="feature-pill">CSV Export</span>
      <span class="feature-pill">JSON Import/Export</span>
      <span class="feature-pill">reCAPTCHA</span>
      <span class="feature-pill">16+ Templates</span>
      <span class="feature-pill">Gutenberg Block</span>
    </div>
  </div>

  <div class="divider"></div>

  <div class="right">
    <div class="bg-circle-1"></div>
    <div class="bg-circle-2"></div>

    <div class="form-card">
      <div class="badge">Free</div>
      <div class="form-card-header">
        <div class="header-dot"></div>
        <div class="header-title">Contact Form</div>
      </div>

      <div class="field-group">
        <div class="field-label"></div>
        <div class="field-input"></div>
      </div>

      <div class="field-group">
        <div class="field-label" style="width:75px;"></div>
        <div class="field-input"></div>
      </div>

      <div class="field-row">
        <div class="field-group">
          <div class="field-label" style="width:65px;"></div>
          <div class="field-input"></div>
        </div>
        <div class="field-group">
          <div class="field-label" style="width:70px;"></div>
          <div class="field-input"></div>
        </div>
      </div>

      <div class="submit-btn">
        <span class="submit-text">Submit Message</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
